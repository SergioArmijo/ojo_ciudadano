
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ojo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ojo_ciudadano
      POSTGRES_USER: ojo_user
      POSTGRES_PASSWORD: ojo_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojo_user -d ojo_ciudadano"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ojo_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgis://ojo_user:ojo_pass@db:5432/ojo_ciudadano
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
